name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test the Node bundle and the compiled binary
        run: |
          node packages/cli/dist/fabpix.js --version
          bun run compile && ./packages/cli/bin/fabpix --help >/dev/null
