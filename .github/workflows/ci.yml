name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Smoke test the Node bundle
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dist/fabpix.js --version
      - run: bun run compile && ./bin/fabpix --help
