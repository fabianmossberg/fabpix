name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "$pkg" = "${{ steps.meta.outputs.version }}" ] || { echo "package.json is $pkg, tag is ${{ steps.meta.outputs.version }}"; exit 1; }
      - name: Compile binaries (Bun cross-compiles all targets)
        run: |
          set -euo pipefail
          mkdir -p release
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build src/cli.ts --compile --target=bun-$t --outfile=build/$t/fabpix
            tar -C build/$t -czf release/fabpix-$t.tar.gz fabpix
          done
          (cd release && sha256sum *.tar.gz > checksums.txt && cat checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release/checksums.txt

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: release
      - name: Render formula
        run: |
          set -euo pipefail
          v="${{ needs.binaries.outputs.version }}"
          sha() { grep "fabpix-$1.tar.gz" release/checksums.txt | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/$v/g" \
              -e "s/{{SHA_DARWIN_ARM64}}/$(sha darwin-arm64)/" \
              -e "s/{{SHA_DARWIN_X64}}/$(sha darwin-x64)/" \
              -e "s/{{SHA_LINUX_ARM64}}/$(sha linux-arm64)/" \
              -e "s/{{SHA_LINUX_X64}}/$(sha linux-x64)/" \
              packaging/homebrew/fabpix.rb.template > fabpix.rb
          cat fabpix.rb
      - name: Push to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/fabianmossberg/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp fabpix.rb tap/Formula/fabpix.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fabpix.rb
          git commit -m "fabpix ${{ needs.binaries.outputs.version }}" || echo "formula unchanged"
          git push
