# Release flow (all automatic after merge):
#   1. release-please watches master. Conventional commits (feat:, fix:, feat!:)
#      decide the next semver; it keeps a "chore(main): release X.Y.Z" PR open
#      that bumps package.json and CHANGELOG.md.
#   2. Merging that PR creates the vX.Y.Z tag + GitHub release.
#   3. The jobs below then build binaries, attach them, publish to npm, and
#      push the Homebrew formula to fabianmossberg/homebrew-tap.
name: Release
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - name: Compile binaries (Bun cross-compiles all targets)
        run: |
          set -euo pipefail
          mkdir -p release
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build src/cli.ts --compile --target=bun-$t --outfile=build/$t/fabpix
            tar -C build/$t -czf release/fabpix-$t.tar.gz fabpix
          done
          (cd release && sha256sum *.tar.gz > checksums.txt && cat checksums.txt)
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release/checksums.txt

  npm:
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: release
      - name: Render formula
        run: |
          set -euo pipefail
          v="${{ needs.release-please.outputs.version }}"
          sha() { grep "fabpix-$1.tar.gz" release/checksums.txt | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/$v/g" \
              -e "s/{{SHA_DARWIN_ARM64}}/$(sha darwin-arm64)/" \
              -e "s/{{SHA_DARWIN_X64}}/$(sha darwin-x64)/" \
              -e "s/{{SHA_LINUX_ARM64}}/$(sha linux-arm64)/" \
              -e "s/{{SHA_LINUX_X64}}/$(sha linux-x64)/" \
              packaging/homebrew/fabpix.rb.template > fabpix.rb
          cat fabpix.rb
      - name: Push to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/fabianmossberg/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp fabpix.rb tap/Formula/fabpix.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fabpix.rb
          git commit -m "fabpix ${{ needs.release-please.outputs.version }}" || echo "formula unchanged"
          git push
